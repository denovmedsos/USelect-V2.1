<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>USelect Gallery Builder</title>

<style>

body{

    font-family:Arial,sans-serif;
    background:#202124;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    height:100vh;

}

.box{

    width:500px;

    background:#2d2f31;

    border-radius:12px;

    padding:40px;

    text-align:center;

    box-shadow:0 10px 40px rgba(0,0,0,.4);

}

button{

    padding:15px 30px;

    font-size:18px;

    cursor:pointer;

    border:none;

    border-radius:8px;

    background:#0f9d58;

    color:white;

}

button:hover{

    background:#0b7d46;

}

#status{

    margin-top:25px;

    font-size:15px;

    color:#ddd;

}

</style>

</head>

<body>

<div class="box">

<h1>USelect</h1>

<h2>Gallery Builder</h2>

<br>

<button id="btn">

Pilih Folder Images

</button>

<div id="status">

Belum ada folder dipilih.

</div>

</div>

<script>

const btn=document.getElementById("btn");

const status=document.getElementById("status");

btn.onclick=async()=>{

if(!window.showDirectoryPicker){

alert("Browser tidak mendukung fitur ini.\nGunakan Google Chrome atau Microsoft Edge.");

return;

}

const dir=await window.showDirectoryPicker();

let files=[];

for await(const entry of dir.values()){

if(entry.kind==="file"){

let name=entry.name;

let ext=name.split(".").pop().toLowerCase();

if(["jpg","jpeg","png","webp"].includes(ext)){

files.push(name);

}

}

}

files.sort();

status.innerHTML="Menemukan <b>"+files.length+"</b> foto.";

let text="const gallery = [\n\n";

files.forEach(f=>{

text+='    "'+f+'",\n';

});

text+="];";

const blob=new Blob([text],{type:"text/javascript"});

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;

a.download="gallery.js";

a.click();

URL.revokeObjectURL(url);

}

</script>

</body>

</html>
